<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Grupo AVE · Iniciar sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/static/styles.css?v=8">
</head>
<body>
<main class="login-page">
  <div class="login">
    <div class="mark-logo"><img src="/assets/logo-grupo-ave.png" alt="Grupo AVE Comedores Industriales" width="220" height="45"><h1>Sistema interno</h1></div>
    <form class="card" id="f" novalidate>
      <div class="field"><label for="u">Usuario</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required></div>
      <div class="err" id="err" role="alert" hidden></div>
      <button class="btn primary" type="submit" id="go">Iniciar sesión</button>
    </form>
    <p class="note">Información privada. La sesión se cierra después de 12 horas.</p>
  </div>
</main>
<script src="/static/login.js?v=3"></script>
</body>
</html>
